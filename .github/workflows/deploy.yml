name: Deploy to AWS

on:
  push:
    branches: [main]
  workflow_dispatch:  # Allow manual trigger from GitHub UI

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install UV
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Add UV to PATH
        run: echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install backend dependencies
        run: |
          cd backend
          uv sync --all-extras

      - name: Run backend tests with coverage
        env:
          API_V1_PREFIX: /v1
        run: |
          cd backend
          uv run pytest --cov=app --cov-report=term-missing --cov-report=xml -v

      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        if: always()
        continue-on-error: true
        with:
          files: ./backend/coverage.xml
          flags: backend
          token: ${{ secrets.CODECOV_TOKEN }}

  deploy:
    name: Deploy Application
    runs-on: ubuntu-latest
    needs: test  # Only deploy if tests pass

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # ── ETF data (baked into Docker image) ───────────────────────────────────

      - name: Download ETF data from S3
        run: |
          mkdir -p backend/data
          aws s3 sync "s3://${{ secrets.ETF_DATA_S3_BUCKET }}/${{ secrets.ETF_DATA_S3_PREFIX }}" backend/data/ \
            --exclude "*" --include "*.csv"
          echo "ETF files downloaded: $(ls backend/data/*.csv 2>/dev/null | wc -l)"

      # ── Database migrations ───────────────────────────────────────────────────

      - name: Setup Python 3.12 (for Alembic migrations)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install UV
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Add UV to PATH
        run: echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install backend dependencies
        run: |
          cd backend
          uv sync --all-extras

      - name: Run Alembic migrations against all databases
        env:
          API_KEY_DB_MAP: ${{ secrets.API_KEY_DB_MAP }}
        run: |
          cd backend
          python3 << 'EOF'
          import json, os, subprocess, sys

          db_map = json.loads(os.environ['API_KEY_DB_MAP'])
          unique_urls = list(dict.fromkeys(db_map.values()))

          for i, url in enumerate(unique_urls, 1):
              print(f"Running migrations for database {i}/{len(unique_urls)}...")
              result = subprocess.run(
                  ['uv', 'run', 'alembic', 'upgrade', 'head'],
                  env={**os.environ, 'DATABASE_URL': url}
              )
              if result.returncode != 0:
                  print(f"Migration failed for database {i}/{len(unique_urls)}")
                  sys.exit(result.returncode)

          print(f"Successfully migrated {len(unique_urls)} database(s)")
          EOF

      # ── Frontend ──────────────────────────────────────────────────────────────

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        env:
          VITE_API_URL: /api/v1
          VITE_DEMO_API_KEY: demo
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Deploy frontend to S3
        run: |
          cd frontend

          # Upload all files except index.html with long cache
          aws s3 sync dist/ s3://${{ secrets.S3_BUCKET_NAME }}/ \
            --delete \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "index.html"

          # Upload index.html separately with short cache
          aws s3 cp dist/index.html s3://${{ secrets.S3_BUCKET_NAME }}/index.html \
            --cache-control "public, max-age=300, must-revalidate"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"

      # ── Backend (Lambda) ──────────────────────────────────────────────────────

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image to ECR
        env:
          IMAGE_URI: ${{ secrets.ECR_REGISTRY }}/${{ secrets.ECR_REPOSITORY }}:${{ github.sha }}
          IMAGE_LATEST: ${{ secrets.ECR_REGISTRY }}/${{ secrets.ECR_REPOSITORY }}:latest
        run: |
          cd backend
          docker build -f Dockerfile.lambda -t $IMAGE_URI -t $IMAGE_LATEST .
          docker push $IMAGE_URI
          docker push $IMAGE_LATEST

      - name: Update Lambda function with new image
        env:
          IMAGE_URI: ${{ secrets.ECR_REGISTRY }}/${{ secrets.ECR_REPOSITORY }}:${{ github.sha }}
        run: |
          aws lambda update-function-code \
            --function-name ${{ secrets.LAMBDA_FUNCTION_NAME }} \
            --image-uri $IMAGE_URI

      - name: Wait for Lambda update to complete
        run: |
          aws lambda wait function-updated \
            --function-name ${{ secrets.LAMBDA_FUNCTION_NAME }}

      - name: Health check
        run: |
          MAX_RETRIES=12
          SLEEP_SECONDS=10
          for i in $(seq 1 $MAX_RETRIES); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              "https://${{ secrets.CLOUDFRONT_DOMAIN }}/api/v1/health" || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "Health check passed"
              exit 0
            fi
            echo "Attempt $i/$MAX_RETRIES: status=$STATUS, retrying in ${SLEEP_SECONDS}s..."
            sleep $SLEEP_SECONDS
          done
          echo "Health check failed after $MAX_RETRIES attempts"
          exit 1
